# 通用框架配置示例
# 以下配置展示了框架支持的所有配置项及其说明

# ========================================
# 通用框架配置
# ========================================

# 启用框架自动配置
framework.common.enabled=true

# 启用全局异常处理器
framework.common.enable-global-exception-handler=true

# 启用MyBatis相关配置
framework.common.enable-mybatis=true

# 启用Swagger相关配置
framework.common.enable-swagger=true

# 启用安全相关配置
framework.common.enable-security=true

# 启用缓存相关配置
framework.common.enable-cache=true

# 启用监控相关配置
framework.common.enable-monitoring=true


# ========================================
# SQL日志配置
# ========================================

# 启用SQL执行日志
framework.common.sql-logger.enabled=true

# 是否显示参数替换后的SQL
framework.common.sql-logger.show-parameters=true

# SQL最大显示长度
framework.common.sql-logger.max-sql-length=1000

# 慢SQL阈值（毫秒）
framework.common.sql-logger.warn-threshold=500


# ========================================
# 安全配置
# ========================================

# JWT密钥（生产环境请使用强密钥）
framework.common.security.jwt.secret=yourStrongSecretKeyHereChangeThisImmediately

# JWT过期时间（分钟，默认24小时）
framework.common.security.jwt.expiration=1440

# JWT刷新提前时间（分钟，默认2小时）
framework.common.security.jwt.refresh-before=120

# Argon2内存成本参数
framework.common.security.password.argon2.memory=65536

# Argon2时间成本参数
framework.common.security.password.argon2.time=2

# Argon2并行度参数
framework.common.security.password.argon2.threads=1


# ========================================
# 缓存配置
# ========================================

# 是否启用本地缓存
framework.common.cache.local-enabled=true

# 本地缓存过期时间（秒）
framework.common.cache.local-expire-after-write=3600

# 是否启用Redis缓存
framework.common.cache.redis-enabled=false

# Redis缓存过期时间（秒）
framework.common.cache.redis-expire-after-write=3600


# ========================================
# 监控配置
# ========================================

# 是否启用指标收集
framework.common.monitoring.metrics-enabled=true

# 是否启用健康检查
framework.common.monitoring.health-check-enabled=true

# 是否启用链路追踪
framework.common.monitoring.trace-enabled=false

# 慢操作阈值（毫秒）
framework.common.monitoring.slow-operation-threshold=1000


# ========================================
# Swagger配置
# ========================================

# 启用Swagger
framework.swagger.enabled=true

# 文档标题
framework.swagger.title=API文档

# 文档描述
framework.swagger.description=API接口文档

# 文档版本
framework.swagger.version=1.0.0

# 上下文路径
framework.swagger.context-path=http://localhost:8080


# ========================================
# MyBatis配置
# ========================================

# 启用SQL日志
mybatis.sql-logger.enabled=true
mybatis.sql-logger.show-parameters=true
mybatis.sql-logger.max-sql-length=1000
mybatis.sql-logger.warn-threshold=500

# MyBatis配置
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.cache-enabled=false
mybatis.configuration.lazy-loading-enabled=false
mybatis.configuration.multiple-result-sets-enabled=true
mybatis.configuration.use-column-label=true
mybatis.configuration.use-generated-keys=true
mybatis.configuration.auto-mapping-behavior=partial
mybatis.configuration.default-statement-timeout=25000
mybatis.configuration.default-fetch-size=100
mybatis.configuration.local-cache-scope=session
mybatis.configuration.jdbc-type-for-null=NULL
mybatis.configuration.lazy-load-trigger-methods=equals,clone,hashCode,toString


# ========================================
# 数据库连接池配置（HikariCP）
# ========================================

# 连接超时时间（毫秒）
spring.datasource.hikari.connection-timeout=30000

# 空闲连接超时时间（毫秒）
spring.datasource.hikari.idle-timeout=600000

# 连接最大生命周期（毫秒）
spring.datasource.hikari.max-lifetime=1800000

# 最大连接池大小
spring.datasource.hikari.maximum-pool-size=20

# 最小空闲连接数
spring.datasource.hikari.minimum-idle=5

# 连接池名称
spring.datasource.hikari.pool-name=HikariPool

# 连接重试次数
spring.datasource.hikari.max-connect-retries=3

# 连接泄漏检测阈值（毫秒）
spring.datasource.hikari.leak-detection-threshold=60000


# ========================================
# Nacos配置
# ========================================

# Nacos服务器地址
spring.cloud.nacos.discovery.server-addr=localhost:8848
spring.cloud.nacos.config.server-addr=localhost:8848


# ========================================
# Actuator配置
# ========================================

# 暴露的端点
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# 健康详情显示级别
management.endpoint.health.show-details=when-authorized

# 启用Prometheus指标导出
management.metrics.export.prometheus.enabled=true


# ========================================
# 日志配置
# ========================================

# 框架日志级别
logging.level.com.tigercub.commonframework=INFO

# Spring Web日志级别
logging.level.org.springframework.web=INFO

# Spring Security日志级别
logging.level.org.springframework.security=INFO

# 事务日志级别
logging.level.org.springframework.transaction=DEBUG

# MyBatis日志级别
logging.level.org.mybatis=DEBUG